apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-web
spec:
  replicas: 2
  template:
    spec:
      hostNetwork: true
      volumes:
        - name: host-root
          hostPath:
            path: /var/log
      containers:
        - name: web
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
          env:
            - name: DB_PASSWORD
              value: supersecret123
---
apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
spec:
  hostPID: true
  containers:
    - name: busybox
      image: busybox
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cleanup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleaner
              image: alpine:latest
